services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: idea
      POSTGRES_PASSWORD: idea
      POSTGRES_DB: idea_pipeline
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idea -d idea_pipeline']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
